name = "cryptoscroll-worker"
account_id = "ac5848ebf55139227e792afe02028b55"
main = "index.ts"
compatibility_date = "2026-11-10"
send_metrics = false
workers_dev = true

[[kv_namespaces]]
binding = "NOTES_KV"
id = "9d40a66a26494bb49ecfc9522bef814a"

[[ratelimits]]
name = "CREATION_LIMITER"
namespace_id = "752524013"
simple = { limit = 30, period = 60 }

[durable_objects]
bindings = [
  { name = "NOTE_VAULT", class_name = "NoteVault" },
  { name = "NOTE_COUNTER", class_name = "NoteCounter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NoteVault", "NoteCounter"]

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://cryptoscroll.syrin.online,https://cryptoscroll.lovable.app,https://preview--cryptoscroll.lovable.app,https://id-preview--0548ff0a-7c6c-49cf-8e02-f78abea146d9.lovable.app"

[[routes]]
pattern = "cryptoscroll.syrin.online/api/*"
zone_name = "syrin.online"

[observability]
enabled = false
